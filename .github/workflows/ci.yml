name: RAPP SDK

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: rapp-sdk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  protocol:
    name: protocol (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -e ".[test]"
      - name: Verify protocol and specification chain
        run: python -m unittest discover -v
      - name: Verify schema/runtime parity
        run: python tests/schema_validator_smoke.py
      - name: Verify Ring Yard schema/semantic parity
        run: python tests/ring_manifest_schema_smoke.py
      - name: Verify public examples
        run: python tests/doctest_smoke.py
      - name: Compile all shipped Python
        run: python -m compileall -q src tests examples

  platform:
    name: platform (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-14
          - windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -e ".[test]"
      - name: Verify platform behavior
        run: python -m unittest discover -v
      - name: Verify schema/runtime parity
        run: python tests/schema_validator_smoke.py
      - name: Verify Ring Yard schema/semantic parity
        run: python tests/ring_manifest_schema_smoke.py
      - name: Verify public examples
        run: python tests/doctest_smoke.py
      - name: Compile all shipped Python
        run: python -m compileall -q src tests examples

  distribution:
    name: distribution (3.14)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - name: Install pinned build tools
        run: >-
          python -m pip install --disable-pip-version-check
          build==1.3.0 setuptools==84.0.0 wheel==0.45.1
      - name: Build wheel and source distribution
        run: python -m build --no-isolation --outdir .build-artifacts
      - name: Materialize pinned offline backend provider
        run: >-
          python -m pip install --disable-pip-version-check
          --target .setuptools-provider setuptools==84.0.0
      - name: Verify isolated wheel and offline source install
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
          RAPP_SDK_SETUPTOOLS_SITE: .setuptools-provider
        run: |
          python tests/distribution_install_smoke.py \
            .build-artifacts/rapp_sdk-0.2.0-py3-none-any.whl \
            .build-artifacts/rapp_sdk-0.2.0.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: rapp-sdk-0.2.0
          path: .build-artifacts/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
